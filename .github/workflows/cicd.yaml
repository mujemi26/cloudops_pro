name: CI/CD Pipeline

on:
  # push:
  #   branches: [ dev ]
  # pull_request:
  #   branches: [ dev ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - production

env:
  DOCKER_IMAGE: cloudops-pro
  DOCKER_REGISTRY: docker.io
  GITOPS_REPO: mujemi26/GitOps
  GITOPS_BRANCH: main
  GITOPS_PATH: Manifests/CloudOps-pro

jobs:
  # CI Job - Build and Push Docker Image
  ci:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
        
    - name: Generate version tag
      id: version
      run: |
        # Get current date for versioning
        DATE=$(date +%Y%m%d)
        
        # Get commit count for this branch to create incremental version
        COMMIT_COUNT=$(git rev-list --count HEAD)
        
        # Create semantic version (v0.1, v0.2, etc.)
        VERSION="v0.$COMMIT_COUNT"
        
        # Create full version with date
        FULL_VERSION="${VERSION}-${DATE}"
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
        echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
        
        echo "Generated version: $VERSION"
        echo "Full version: $FULL_VERSION"
        echo "Commit count: $COMMIT_COUNT"
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}
        tags: |
          type=raw,value=${{ steps.version.outputs.version }}
          type=raw,value=${{ steps.version.outputs.full_version }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix={{branch}}-
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Output image info
      run: |
        echo "All tags: ${{ steps.meta.outputs.tags }}"
        echo "Version: ${{ steps.version.outputs.version }}"
        echo "Full version: ${{ steps.version.outputs.full_version }}"
        echo "Commit count: ${{ steps.version.outputs.commit_count }}"
        echo "Digest: ${{ steps.meta.outputs.digest }}"
        
    - name: Set image output
      id: image
      run: |
        # Use the semantic version as the primary tag
        VERSION_TAG="${{ steps.version.outputs.version }}"
        FULL_IMAGE="${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:$VERSION_TAG"
        
        echo "image=$FULL_IMAGE" >> $GITHUB_OUTPUT
        echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
        echo "digest=${{ steps.meta.outputs.digest }}" >> $GITHUB_OUTPUT
        
        echo "Primary image tag: $FULL_IMAGE"
        echo "Version: $VERSION_TAG"

  # CD Job - GitOps Deployment
  cd:
    name: Deploy to Kubernetes via GitOps
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Checkout GitOps repository
      uses: actions/checkout@v4
      with:
        repository: ${{ env.GITOPS_REPO }}
        token: ${{ secrets.GITOPS_TOKEN }}
        path: gitops-repo
        
    - name: Setup GitOps
      run: |
        cd gitops-repo
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
    - name: Update deployment image
      id: update-image
      run: |
        cd gitops-repo
        
        # Debug: List directory contents
        echo "Current directory: $(pwd)"
        echo "Directory contents:"
        ls -la
        
        # Get the new image tag
        NEW_IMAGE="${{ needs.ci.outputs.image }}"
        echo "New image: $NEW_IMAGE"
        
        # Check if deployment file exists in the correct path
        DEPLOYMENT_FILE="Manifests/CloudOps-pro/deployment.yaml"
        if [ -f "$DEPLOYMENT_FILE" ]; then
          echo "Found deployment file at $DEPLOYMENT_FILE"
          # Show current content
          echo "Current deployment content:"
          cat "$DEPLOYMENT_FILE"
          
          # Update image in deployment
          sed -i "s|image:.*|image: $NEW_IMAGE|g" "$DEPLOYMENT_FILE"
          
          echo "Updated deployment with image: $NEW_IMAGE"
          echo "Updated deployment content:"
          cat "$DEPLOYMENT_FILE"
        else
          echo "Deployment file not found at $DEPLOYMENT_FILE"
          echo "Available files in Manifests/CloudOps-pro:"
          ls -la "Manifests/CloudOps-pro" || echo "Directory does not exist"
          echo "Available files in Manifests:"
          ls -la "Manifests" || echo "Directory does not exist"
          exit 1
        fi
        
    - name: Commit and push changes
      run: |
        cd gitops-repo
        
        # Debug: Check current branch and remote
        echo "Current branch: $(git branch --show-current)"
        echo "Available branches:"
        git branch -a
        echo "Remote branches:"
        git branch -r
        
        # Check if there are changes
        if git diff --quiet; then
          echo "No changes to commit"
        else
          # Add all changes
          git add .
          
          # Commit with meaningful message including version
          VERSION="${{ needs.ci.outputs.version }}"
          COMMIT_MSG="Update CloudOps Pro image to ${{ needs.ci.outputs.image }} (Version: $VERSION)"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            COMMIT_MSG="$COMMIT_MSG (Manual deployment to ${{ github.event.inputs.environment }})"
          fi
          
          git commit -m "$COMMIT_MSG"
          
          # Try to push to the correct branch
          CURRENT_BRANCH=$(git branch --show-current)
          echo "Pushing to branch: $CURRENT_BRANCH"
          git push origin $CURRENT_BRANCH
          
          echo "Pushed changes to GitOps repository"
        fi
        
    - name: Wait for ArgoCD sync
      run: |
        echo "Waiting for ArgoCD to detect changes..."
        echo "ArgoCD will automatically sync the deployment"
        echo "You can monitor the sync status in your ArgoCD dashboard"
        
    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.ci.outputs.version }}
        release_name: CloudOps Pro ${{ needs.ci.outputs.version }}
        body: |
          ## CloudOps Pro ${{ needs.ci.outputs.version }}
          
          ### Changes
          - Updated Docker image to ${{ needs.ci.outputs.image }}
          - Deployed to ${{ github.event.inputs.environment }} environment
          
          ### Docker Image
          ```
          ${{ needs.ci.outputs.image }}
          ```
          
          ### Commit
          ${{ github.sha }}
        draft: false
        prerelease: false
        
    - name: Notify deployment
      run: |
        echo "🚀 Deployment initiated!"
        echo "Image: ${{ needs.ci.outputs.image }}"
        echo "Version: ${{ needs.ci.outputs.version }}"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "ArgoCD will sync automatically"

