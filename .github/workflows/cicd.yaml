name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - production

env:
  DOCKER_IMAGE: cloudops-pro
  DOCKER_REGISTRY: docker.io
  GITOPS_REPO: mujemi26/GitOps
  GITOPS_BRANCH: main
  GITOPS_PATH: Manifests/CloudOps-pro

jobs:
  # CI Job - Build and Push Docker Image
  ci:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
        
    - name: Generate version
      id: version
      run: |
        COMMIT_COUNT=$(git rev-list --count HEAD)
        VERSION="v0.$COMMIT_COUNT"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Set image output
      id: image
      run: |
        IMAGE_TAG="${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}"
        echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "version=${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
        echo "Image: $IMAGE_TAG"
        


  # CD Job - GitOps Deployment
  cd:
    name: Deploy to Kubernetes via GitOps
    runs-on: ubuntu-latest
    needs: ci
    
    steps:
    - name: Checkout GitOps repository
      uses: actions/checkout@v4
      with:
        repository: ${{ env.GITOPS_REPO }}
        token: ${{ secrets.GITOPS_TOKEN }}
        
    - name: Setup GitOps
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
    - name: Update deployment image
      run: |
        # Use the image and version from CI job
        NEW_IMAGE="${{ needs.ci.outputs.image }}"
        VERSION="${{ needs.ci.outputs.version }}"
        
        echo "Using image from CI job: $NEW_IMAGE"
        echo "Using version from CI job: $VERSION"
        
        # Update deployment.yaml
        DEPLOYMENT_FILE="Manifests/CloudOps-pro/deployment.yaml"
        if [ -f "$DEPLOYMENT_FILE" ]; then
          # Show current content for debugging
          echo "Current deployment content:"
          cat "$DEPLOYMENT_FILE"
          
          # Simple and direct image replacement
          echo "Replacing image with: $NEW_IMAGE"
          
          # Replace the image line directly
          sed -i "s|image:.*|image: $NEW_IMAGE|g" "$DEPLOYMENT_FILE"
          
          # Verify the update worked
          if grep -q "image: $NEW_IMAGE" "$DEPLOYMENT_FILE"; then
            echo "✅ Successfully updated deployment with image: $NEW_IMAGE"
          else
            echo "❌ Failed to update image. Current content:"
            cat "$DEPLOYMENT_FILE"
            exit 1
          fi
          
          echo "Updated deployment content:"
          cat "$DEPLOYMENT_FILE"
        else
          echo "Deployment file not found at $DEPLOYMENT_FILE"
          exit 1
        fi
        
    - name: Commit and push changes
      run: |
        # Check if there are changes
        if git diff --quiet; then
          echo "No changes to commit"
        else
          # Add all changes
          git add .
          
          # Commit with version info
          VERSION="${{ needs.ci.outputs.version }}"
          COMMIT_MSG="Update CloudOps Pro image to ${{ needs.ci.outputs.image }} (Version: $VERSION)"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            COMMIT_MSG="$COMMIT_MSG (Manual deployment to ${{ github.event.inputs.environment }})"
          fi
          
          git commit -m "$COMMIT_MSG"
          
          # Push to current branch
          CURRENT_BRANCH=$(git branch --show-current)
          git push origin $CURRENT_BRANCH
          
          echo "Pushed changes to GitOps repository"
        fi
        
    - name: Notify deployment
      run: |
        echo "🚀 Deployment completed!"
        echo "Image: ${{ needs.ci.outputs.image }}"
        echo "Version: ${{ needs.ci.outputs.version }}"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "ArgoCD will sync automatically"
