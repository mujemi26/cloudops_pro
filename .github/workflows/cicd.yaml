name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - production

env:
  DOCKER_IMAGE: cloudops-pro
  DOCKER_REGISTRY: docker.io
  GITOPS_REPO: mujemi26/GitOps
  GITOPS_BRANCH: master
  GITOPS_PATH: Manifests/CloudOps-pro

jobs:
  # CI Job - Build and Push Docker Image
  ci:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
        
    - name: Generate version
      id: version
      run: |
        # Get commit SHA and timestamp for unique versioning
        COMMIT_SHA=$(git rev-parse --short HEAD)
        TIMESTAMP=$(date +%s)
        VERSION="v0.$TIMESTAMP-$COMMIT_SHA"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"
        echo "Commit SHA: $COMMIT_SHA"
        echo "Timestamp: $TIMESTAMP"
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Set image output
      id: image
      run: |
        IMAGE_TAG="${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}"
        echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "version=${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
        echo "Image: $IMAGE_TAG"
        


  # CD Job - GitOps Deployment
  cd:
    name: Deploy to Kubernetes via GitOps
    runs-on: ubuntu-latest
    needs: ci
    
    steps:
    - name: Checkout GitOps repository
      uses: actions/checkout@v4
      with:
        repository: ${{ env.GITOPS_REPO }}
        token: ${{ secrets.GITOPS_TOKEN }}
        ref: ${{ env.GITOPS_BRANCH }}
        
    - name: Setup GitOps
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
    - name: Debug GitOps repository
      run: |
        echo "Current branch: $(git branch --show-current)"
        echo "Repository structure:"
        find . -type f -name "*.yaml" -o -name "*.yml" | head -20
        echo "Manifests/CloudOps-pro/ contents:"
        ls -la "Manifests/CloudOps-pro/" || echo "Directory not found"
        
    - name: Update deployment image
      run: |
        # Get version from CI job or construct image tag directly
        VERSION="${{ needs.ci.outputs.version }}"
        NEW_IMAGE="${{ needs.ci.outputs.image }}"
        
        # If NEW_IMAGE is empty, construct it using the version
        if [ -z "$NEW_IMAGE" ]; then
          echo "Image output is empty, constructing image tag..."
          NEW_IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloudops-pro:$VERSION"
          echo "Constructed image: $NEW_IMAGE"
        fi
        
        echo "Using image: $NEW_IMAGE"
        echo "Using version: $VERSION"
        
        # Update deployment.yaml
        DEPLOYMENT_FILE="Manifests/CloudOps-pro/deployment.yaml"
        if [ -f "$DEPLOYMENT_FILE" ]; then
          # Show current content for debugging
          echo "Current deployment content:"
          cat "$DEPLOYMENT_FILE"
          
          # Create a backup
          cp "$DEPLOYMENT_FILE" "${DEPLOYMENT_FILE}.backup"
          
          # Update the image using sed (simple and reliable)
          echo "Updating image to: $NEW_IMAGE"
          sed -i "s|^[[:space:]]*image:[[:space:]]*.*|        image: $NEW_IMAGE|" "$DEPLOYMENT_FILE"
          
          # Verify the update worked
          if grep -q "image: $NEW_IMAGE" "$DEPLOYMENT_FILE"; then
            echo "✅ Successfully updated deployment with image: $NEW_IMAGE"
          else
            echo "❌ Failed to update image. Current content:"
            cat "$DEPLOYMENT_FILE"
            echo "Restoring backup..."
            cp "${DEPLOYMENT_FILE}.backup" "$DEPLOYMENT_FILE"
            exit 1
          fi
          
          echo "Updated deployment content:"
          cat "$DEPLOYMENT_FILE"
        else
          echo "Deployment file not found at $DEPLOYMENT_FILE"
          echo "Available files in Manifests/CloudOps-pro/:"
          ls -la "Manifests/CloudOps-pro/" || echo "Directory not found"
          exit 1
        fi
        
    - name: Commit and push changes
      run: |
        # Check if there are changes
        if git diff --quiet; then
          echo "No changes to commit"
        else
          # Add all changes
          git add .
          
          # Commit with version info
          VERSION="${{ needs.ci.outputs.version }}"
          COMMIT_MSG="Update CloudOps Pro image to ${{ needs.ci.outputs.image }} (Version: $VERSION)"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            COMMIT_MSG="$COMMIT_MSG (Manual deployment to ${{ github.event.inputs.environment }})"
          fi
          
          git commit -m "$COMMIT_MSG"
          
          # Push to current branch
          CURRENT_BRANCH=$(git branch --show-current)
          git push origin $CURRENT_BRANCH
          
          echo "Pushed changes to GitOps repository"
        fi
        
    - name: Notify deployment
      run: |
        echo "🚀 Deployment completed!"
        echo "Image: ${{ needs.ci.outputs.image }}"
        echo "Version: ${{ needs.ci.outputs.version }}"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "ArgoCD will sync automatically"
