apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-pro
  labels:
    app: cloudops-pro
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudops-pro
  template:
    metadata:
      labels:
        app: cloudops-pro
        version: v1
    spec:
      containers:
      - name: cloudops-pro
        image: cloudops-pro:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: cloudops-pro-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always 